name: Self-test

on:
  push:
    branches:
      - main
      - feature/unified-anime-seasons
  pull_request:
    branches:
      - main

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run offline self-test
        run: npm run selftest
